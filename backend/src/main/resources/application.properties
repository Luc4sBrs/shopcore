spring.config.import=optional:file:../.env[.properties]

spring.application.name=shopcore-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://db.jwluhjkcgjlycoujnrji.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JPA
spring.jpa.open-in-view=false

# Porta (evita conflito com portas ephemeras do Steam)
server.port=${SERVER_PORT:8090}

# JWT
application.security.jwt.secret-key=shopcore-super-secret-key-for-jwt-authentication-must-be-long
application.security.jwt.expiration=86400000

# Supabase
supabase.url=${SUPABASE_URL:https://jwluhjkcgjlycoujnrji.supabase.co}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.jwks-url=${SUPABASE_JWKS_URL:https://jwluhjkcgjlycoujnrji.supabase.co/auth/v1/.well-known/jwks.json}

version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: shopcore-db
    environment:
      POSTGRES_DB: shopcore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: shopcore-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@shopcore.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
